<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode Clone | Problems</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body id="problems-page">
  <header class="site-header">
    <nav class="navbar container">
      <a href="index.html" class="logo"><span>LC</span>Code</a>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="problems.html" class="active">Problems</a></li>
        <li><a href="contests.html">Contest</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="container page-panel">
    <section class="page-header">
      <div>
        <span class="eyebrow">Problem Archive</span>
        <h1>Practice Problems</h1>
        <p>Search by title, difficulty, or status to focus on the right challenge.</p>
      </div>
      <div class="search-panel glass">
        <input type="text" id="search-input" placeholder="Search problems..." autocomplete="off">
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="easy">Easy</button>
          <button class="filter-btn" data-filter="medium">Medium</button>
          <button class="filter-btn" data-filter="hard">Hard</button>
        </div>
      </div>
    </section>

    <section class="table-section glass">
      <div class="table-header">
        <h2>Problem List</h2>
        <span id="problem-count">0 problems</span>
      </div>
      <div class="table-wrapper">
        <table class="problems-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Title</th>
              <th>Difficulty</th>
              <th>Acceptance</th>
            </tr>
          </thead>
          <tbody id="problems-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer container">
    <p>Pure frontend problem board with search and filters.</p>
  </footer>
</body>
</html>
